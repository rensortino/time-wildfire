# Configuration for 3D ResNet (video-based)

# Training parameters
epochs: 50
lr: 1.0e-4
device: cuda:0
batch_size: 16  # Smaller batch size for 3D convolutions
num_workers: 4
dropout: 0.1

# Logging and checkpointing
checkpoint_dir: checkpoints/3dresnet
log_dir: logs/3dresnet
checkpoint_frequency: 10  # Save checkpoint every N epochs

# Data parameters
img_size: 224
train_dir: data/images/train
val_dir: data/images/val
num_frames: 8  # Number of frames in video sequence

# Model parameters
backbone: 3dresnet
pretrained: true
freeze_backbone: true

# VideoMAE-specific parameters (not used for 3dresnet)
videomae_model_name: "MCG-NJU/videomae-base"

# ViViT-specific parameters (not used for 3dresnet)
vivit_model_name: "google/vivit-b-16x2-kinetics400"

# CNN+Transformer-specific parameters (not used for 3dresnet)
transformer_embed_dim: 512
transformer_num_heads: 8
transformer_num_layers: 4

